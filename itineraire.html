<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracé Itinéraire - Kimia Track</title>
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        
        /* En-tête Statistique */
        .stats-bar { display: flex; justify-content: space-around; background: var(--card); padding: 15px; border-bottom: 1px solid var(--primary); }
        .stat-item { text-align: center; }
        .stat-value { display: block; font-weight: bold; color: var(--primary); font-size: 18px; }
        .stat-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }

        /* Zone de la Carte (Simulée ici) */
        #map-container { width: 100%; height: 350px; background: #1e293b; position: relative; overflow: hidden; }
        .map-placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: #475569; font-style: italic; }

        /* Liste des points d'itinéraire */
        .timeline { padding: 20px; }
        .log-entry { border-left: 2px solid var(--primary); padding-left: 15px; margin-bottom: 20px; position: relative; }
        .log-entry::before { content: ''; position: absolute; left: -7px; top: 0; width: 12px; height: 12px; background: var(--primary); border-radius: 50%; }
        .log-time { font-size: 12px; font-weight: bold; color: var(--primary); }
        .log-address { font-size: 14px; display: block; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="stats-bar">
        <div class="stat-item">
            <span class="stat-label">Cible</span>
            <span class="stat-value" id="target-id">---</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Distance</span>
            <span class="stat-value" id="stat-distance">0.0 km</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Points</span>
            <span class="stat-value" id="stat-points">0</span>
        </div>
    </div>

    <div id="map-container">
        <div class="map-placeholder" id="map-text">Chargement du tracé satellite...</div>
    </div>

    <div class="timeline">
        <h3 style="font-size: 14px; color: #94a3b8; margin-bottom: 20px;">HISTORIQUE DU PARCOURS (DERNIÈRES 24H)</h3>
        
        <div id="logs-container">
            <div style="color: #94a3b8; font-style: italic; font-size: 13px;">Recherche de positions satellites...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configuration de tes clés d'accès Supabase globales
        const SUPABASE_URL = "https://ufwirghypzowlmeqqgco.supabase.co";
        const SUPABASE_KEY = "sb_publishable_ZMjol0IAFBrmaZULUzR7IA_Gk31Msqq";
        
        // CORRECTION DE LIAISON : Utilisation directe de l'objet pour la liaison CDN
        const supabase = supabase.supabasejs.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const tel = urlParams.get('tel');
        
        window.onload = function() {
            if(tel) {
                document.getElementById('target-id').innerText = tel;
                // Appel immédiat de la fonction pour interroger la table "historique_parcours"
                chargerHistoriqueDepuisSupabase(tel);
            } else {
                document.getElementById('map-text').innerText = "Aucune cible détectée dans l'URL.";
                document.getElementById('logs-container').innerHTML = `<div style="color: #ef4444; font-size: 13px;">Erreur : Paramètre 'tel' manquant.</div>`;
            }
        };

        // Extraction en temps réel des données enregistrées en base
        async function chargerHistoriqueDepuisSupabase(numeroCible) {
            try {
                const { data, error } = await supabase
                    .from('historique_parcours')
                    .select('*')
                    .eq('telephone_cible', numeroCible)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const container = document.getElementById('logs-container');
                
                if (data && data.length > 0) {
                    // Calcul dynamique et mise à jour des indicateurs en haut
                    document.getElementById('stat-points').innerText = data.length;
                    document.getElementById('stat-distance').innerText = (data.length * 0.4).toFixed(1) + " km";
                    document.getElementById('map-text').innerText = "Tracé satellite synchronisé avec succès.";

                    // Vider l'indicateur d'attente
                    container.innerHTML = "";

                    // Parcourir chaque enregistrement trouvé dans la table "historique_parcours"
                    data.forEach(point => {
                        const dateObj = new Date(point.created_at);
                        const heureFormatee = dateObj.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                        const entry = document.createElement('div');
                        entry.className = 'log-entry';
                        entry.innerHTML = `
                            <span class="log-time">${heureFormatee}</span>
                            <span class="log-address"><strong>${point.moyen_transport}</strong> : ${point.emplacement} ${point.details_vitesse ? `(${point.details_vitesse})` : ''}</span>
                        `;
                        container.appendChild(entry);
                    });
                } else {
                    document.getElementById('map-text').innerText = "Aucun signal géographique reçu.";
                    container.innerHTML = `<div style="color: #94a3b8; font-style: italic; font-size: 13px;">Aucun point détecté dans la base de données pour ce numéro.</div>`;
                }
            } catch (err) {
                console.error("Erreur d'extraction :", err.message);
                document.getElementById('map-text').innerText = "Échec de connexion au relais.";
            }
        }
    </script>
</body>
</html>
