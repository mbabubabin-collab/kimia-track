<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimia Track - Admin Panel</title>
    <style>
        :root { 
            --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; 
            --accent: #eab308; --danger: #ef4444; --success: #22c55e; --manager: #a855f7;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; }
        .login-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; width: 95%; max-width: 500px; border: 1px solid #334155; margin: 0 auto 15px auto; box-sizing: border-box; }
        .nav-tabs { display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .tab { padding: 8px 15px; background: #2d3a4f; border-radius: 20px; font-size: 0.8rem; cursor: pointer; white-space: nowrap; }
        .tab.active { background: var(--primary); color: var(--bg); font-weight: bold; }
        .section { display: none; }
        .section.active { display: block; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th, td { border: 1px solid #334155; padding: 10px; text-align: left; }
        th { background: #2d3a4f; color: var(--primary); }
        input, select, textarea { width: 100%; padding: 10px; margin: 5px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-acc { background: var(--success); color: white; }
        .rubrique-credit { background: #0f172a; padding: 10px; border-radius: 8px; border-left: 3px solid var(--primary); margin-bottom: 10px; }
        #preview-img { max-width: 100%; border-radius: 8px; margin-top: 10px; display: none; }
        
        /* Styles additionnels pour les finances */
        .stat-box { background: #0f172a; padding: 12px; border-radius: 8px; border-bottom: 3px solid transparent; }
        .net-gain { background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid var(--success); margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

    <div id="login-screen" class="login-overlay">
        <h2 style="color: var(--primary);">KIMIA TRACK ADMIN</h2>
        <div class="card">
            <input type="password" id="admin-pass" placeholder="Code d'accès...">
            <button class="btn" style="background: var(--primary);" onclick="verifierAcces()">CONNEXION</button>
        </div>
    </div>

    <div id="main-dashboard" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="margin:0">Admin Panel</h3>
            <span id="role-display" style="font-size:0.7rem; padding:4px 10px; border-radius:10px;"></span>
        </div>

        <div class="nav-tabs">
            <div class="tab active" onclick="switchTab(0)">👥 Registre</div>
            <div class="tab" onclick="switchTab(1)">💳 Crédits</div>
            <div class="tab" onclick="switchTab(2)">📢 Marketing</div>
            <div class="tab" onclick="switchTab(3)">💰 Finances</div>
        </div>

        <!-- REGISTRE -->
        <div id="sec-0" class="section active">
            <div class="card">
                <table id="table-inscrits">
                    <thead><tr><th>Client</th><th>Cibles</th><th>Statut</th></tr></thead>
                    <tbody id="body-inscrits"></tbody>
                </table>
            </div>
        </div>

        <!-- CRÉDITS -->
        <div id="sec-1" class="section">
            <div class="card" id="container-rubriques-credits"></div>
        </div>

        <!-- MARKETING -->
        <div id="sec-2" class="section">
            <div class="card">
                <h4>Campagne WhatsApp</h4>
                <p style="font-size:0.7rem; color:gray;">Cibles : <span id="count-marketing">0</span> inscrit(s) détecté(s).</p>
                <textarea id="msg-marketing" rows="3" placeholder="Texte de diffusion..."></textarea>
                
                <label style="font-size:0.8rem;">Attacher un visuel (Upload) :</label>
                <input type="file" id="file-marketing" accept="image/*" onchange="previewFile()">
                <img id="preview-img" src="">

                <button class="btn" style="background: #25d366; color: white;" onclick="lancerMarketing()">DIFFUSER AUX INSCRITS</button>
            </div>
        </div>

        <!-- FINANCES PROFESSIONNELLES -->
        <div id="sec-3" class="section">
            <div class="card">
                <h4 style="margin-top:0;">Bilan Financier (CDF)</h4>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <div class="stat-box" style="border-color: var(--primary);">
                        <span style="font-size: 0.65rem; color: gray;">CA TOTAL</span>
                        <div id="fin-ca-total" style="color: white; font-weight: bold;">0 FC</div>
                    </div>
                    <div class="stat-box" style="border-color: var(--danger);">
                        <span style="font-size: 0.65rem; color: gray;">FRAIS SMS</span>
                        <div id="fin-couts-sms" style="color: var(--danger); font-weight: bold;">0 FC</div>
                    </div>
                </div>

                <div class="net-gain">
                    <span style="font-size: 0.75rem; color: var(--success);">BÉNÉFICE (GAIN PLATEFORME)</span>
                    <div id="fin-benefice" style="color: white; font-weight: bold; font-size: 1.4rem;">0 FC</div>
                </div>

                <h5 style="font-size:0.8rem; margin: 15px 0 5px 0;">Répartition Mobile Money :</h5>
                <div id="flux-reseaux" style="font-size: 0.75rem; background: #0f172a; padding: 10px; border-radius: 8px;"></div>

                <button class="btn" style="background: var(--primary); color: #0f172a;" onclick="genererRapport()">📄 GÉNÉRER RAPPORT</button>
            </div>
        </div>

        <button class="btn" style="background: #334155; margin-top: 10px;" onclick="location.reload()">DÉCONNEXION</button>
    </div>

    <script>
        let currentRole = "";
        const PRIX_UNITE_50 = 5500; // 5500 FC pour 50 unités
        const COUT_SMS_FIXE = 1500; // 1500 FC par mois par utilisateur

        function verifierAcces() {
            const pass = document.getElementById('admin-pass').value;
            if(pass === "KIMBANGU0") currentRole = "TOP_MANAGER";
            else if(pass === "Christine0") currentRole = "GESTIONNAIRE";
            else if(pass === "Renathes1") currentRole = "COMPTABILITE";
            else return alert("Code erroné");

            document.getElementById('role-display').innerText = currentRole;
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('main-dashboard').style.display = "block";
            chargerDonnees();
        }

        function chargerDonnees() {
            const body = document.getElementById('body-inscrits');
            const containerCredits = document.getElementById('container-rubriques-credits');
            
            const nom = localStorage.getItem('kt_user_nom');
            const idSession = localStorage.getItem('kt_session_id');
            const telClient = localStorage.getItem('kt_user_tel') || "Non spécifié";
            const ciblesRaw = localStorage.getItem('kt_details_cibles');

            if(!idSession) {
                body.innerHTML = "<tr><td colspan='3'>Aucun inscrit.</td></tr>";
                return;
            }

            const cibles = JSON.parse(ciblesRaw);
            const totalUnites = cibles.reduce((acc, c) => acc + (c.solde || 0), 0);

            body.innerHTML = `<tr><td>${nom}<br><small>${idSession}</small></td><td>${cibles.length}</td><td>${totalUnites > 0 ? '✅ Actif' : '⏳ Attente'}</td></tr>`;

            containerCredits.innerHTML = `<h4>Rubriques de ${nom}</h4>`;
            cibles.forEach((c, i) => {
                containerCredits.innerHTML += `
                    <div class="rubrique-credit">
                        <span>Cible: <b>${c.numero}</b> (${c.type})</span><br>
                        <small>Solde: ${c.solde || 0} U</small>
                        <div style="display:flex; gap:5px; margin-top:5px;">
                            <input type="number" id="inp-${i}" value="50">
                            <button class="btn-acc" onclick="crediterCible(${i})">OK</button>
                        </div>
                    </div>`;
            });

            document.getElementById('count-marketing').innerText = "1";
            calculerFinances(totalUnites);
        }

        function calculerFinances(totalUnites) {
            const nbRecharges = Math.floor(totalUnites / 50);
            const caTotal = nbRecharges * PRIX_UNITE_50;
            const coutsSms = (nbRecharges > 0) ? COUT_SMS_FIXE : 0;
            const benefice = caTotal - coutsSms;

            document.getElementById('fin-ca-total').innerText = caTotal.toLocaleString() + " FC";
            document.getElementById('fin-couts-sms').innerText = coutsSms.toLocaleString() + " FC";
            document.getElementById('fin-benefice').innerText = benefice.toLocaleString() + " FC";

            // Répartition (simulation basée sur les réseaux RDC)
            const reseaux = [
                {n: "M-Pesa", c: "#ffcc00", p: 0.4},
                {n: "Airtel", c: "#ed1c24", p: 0.3},
                {n: "Orange", c: "#ff6600", p: 0.2},
                {n: "Africel", c: "#38bdf8", p: 0.1}
            ];
            
            let htmlRes = "";
            reseaux.forEach(r => {
                htmlRes += `<div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                    <span><span style="color:${r.c}">●</span> ${r.n}</span>
                    <b>${Math.floor(caTotal * r.p).toLocaleString()} FC</b>
                </div>`;
            });
            document.getElementById('flux-reseaux').innerHTML = htmlRes;
        }

        function crediterCible(index) {
            let cibles = JSON.parse(localStorage.getItem('kt_details_cibles'));
            const val = parseInt(document.getElementById(`inp-${index}`).value);
            cibles[index].solde = (cibles[index].solde || 0) + val;
            localStorage.setItem('kt_details_cibles', JSON.stringify(cibles));
            alert("Compte accrédité !");
            chargerDonnees();
        }

        function previewFile() {
            const preview = document.getElementById('preview-img');
            const file = document.getElementById('file-marketing').files[0];
            const reader = new FileReader();
            reader.onloadend = () => { preview.src = reader.result; preview.style.display = "block"; }
            if (file) reader.readAsDataURL(file);
        }

        function lancerMarketing() {
            const tel = localStorage.getItem('kt_user_tel');
            const msg = document.getElementById('msg-marketing').value;
            if(!tel || !msg) return alert("Données manquantes");
            window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function genererRapport() {
            const ca = document.getElementById('fin-ca-total').innerText;
            const benef = document.getElementById('fin-benefice').innerText;
            const client = localStorage.getItem('kt_user_nom');
            const date = new Date().toLocaleDateString();
            
            const rapport = `RAPPORT FINANCIER KIMIA TRACK\nDate: ${date}\nClient: ${client}\n---------------------------\nCA TOTAL: ${ca}\nCOUT SMS: 1500 FC\nGAIN NET: ${benef}\n---------------------------\nStatut: Validé par Admin`;
            
            alert(rapport + "\n\n(Rapport prêt pour archivage)");
            console.log(rapport);
        }

        function switchTab(i) {
            document.querySelectorAll('.section').forEach((s, idx) => s.classList.toggle('active', i === idx));
            document.querySelectorAll('.tab').forEach((t, idx) => t.classList.toggle('active', i === idx));
        }
    </script>
</body>
</html>
