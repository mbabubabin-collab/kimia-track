<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Kimia Track</title>
    <style>
        :root { 
            --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; 
            --accent: #eab308; --success: #22c55e; --danger: #ef4444; --shadow: rgba(0,0,0,0.3);
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; padding-bottom: 90px; }
        
        /* Header & Session */
        .header-app { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: var(--card); padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px var(--shadow); }
        .session-info { font-size: 11px; color: var(--primary); letter-spacing: 1px; }
        .user-name { font-weight: bold; font-size: 18px; color: white; }

        /* Formulaire d'ajout rapide (Intégré sans casser le design) */
        .add-target-box { background: var(--card); border: 1px dashed #475569; border-radius: 12px; padding: 15px; margin-bottom: 25px; }
        .add-target-box h3 { margin: 0 0 10px 0; font-size: 14px; color: var(--primary); }
        .add-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .add-inputs input { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px; color: white; font-size: 13px; }
        .btn-add-submit { background: var(--primary); color: #0f172a; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 13px; }

        /* Grille des Cibles Individualisées */
        .target-grid { display: flex; flex-direction: column; gap: 20px; }
        .target-card { background: var(--card); border-radius: 16px; border: 1px solid #334155; overflow: hidden; position: relative; }
        
        .target-header { background: rgba(56, 189, 248, 0.1); padding: 12px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .status-badge { font-size: 10px; background: var(--success); color: white; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; font-weight: bold; }
        
        .target-body { padding: 15px; }
        .balance-box { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px; border-radius: 10px; margin-bottom: 15px; }
        .balance-label { font-size: 11px; color: #94a3b8; }
        .balance-value { font-size: 16px; font-weight: bold; color: var(--accent); }

        /* Grille d'actions tactiques */
        .action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .btn-tactic { 
            background: #2d3a4f; border: 1px solid #475569; color: white; 
            padding: 12px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; 
            cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; transition: 0.2s;
        }
        .btn-tactic:active { transform: scale(0.95); background: var(--primary); color: #0f172a; }
        .btn-tactic span { font-size: 16px; }

        /* Bouton Approvisionnement (Spécial) */
        .btn-refill { grid-column: span 2; background: rgba(34, 197, 94, 0.1); border: 1px dashed var(--success); color: var(--success); }

        /* Navigation Basse */
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid #334155; z-index: 100; }
        .nav-btn { color: #94a3b8; text-decoration: none; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        .nav-btn.active { color: var(--primary); }
        .nav-btn.reclamation { color: var(--accent); }
        .nav-btn.help { color: #38bdf8; } 
    </style>
</head>
<body>

    <div class="header-app">
        <div>
            <span class="session-info" id="session-id">INITIALISATION...</span>
            <div class="user-name" id="user-name">Chargement...</div>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 10px; color: #94a3b8;">STATUT COMPTE</div>
            <div style="font-size: 14px; font-weight: bold; color: var(--accent);" id="account-status">GOLD</div>
        </div>
    </div>

    <div class="add-target-box">
        <h3>📡 Ajouter un nouveau terminal à suivre</h3>
        <div class="add-inputs">
            <input type="text" id="nom_cible" placeholder="Nom (Ex: Ma Voiture)">
            <input type="tel" id="telephone_cible" placeholder="N° de téléphone">
        </div>
        <button class="btn-add-submit" onclick="ajouterCible()">ENREGISTRER LA CIBLE</button>
    </div>

    <div class="target-grid" id="target-container">
        <div style="text-align:center; padding:40px; color:#64748b; font-style:italic;">Recherche et synchronisation des relais satellites...</div>
    </div>

    <nav class="nav-bar">
        <a href="aide.html" class="nav-btn help"><span>❓</span>Aide</a>
        <a href="#" class="nav-btn active"><span>📡</span>Radar</a>
        <a href="approvisionnement.html" class="nav-btn"><span>💰</span>Wallet</a>
        <a href="https://wa.me/243861769481" class="nav-btn reclamation" target="_blank"><span>⚠️</span>Réclamation</a>
        <a href="#" class="nav-btn" onclick="deconnexion()"><span>🔒</span>Quitter</a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://ufwirghypzowlmeqqgco.supabase.co";
        const SUPABASE_KEY = "sb_publishable_ZMjol0IAFBrmaZULUzR7IA_Gk31Msqq";
        
        let supabase;
        const userTel = localStorage.getItem('kt_user_tel');
        
        // Correction de l'instanciation de Supabase pour éviter les crashs sur mobile
        if (typeof supabase !== 'undefined') {
            supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } else if (typeof Supabase !== 'undefined') {
            supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        // Sécurité de session locale
        if (!userTel) {
            window.location.href = 'identification.html';
        }

        window.onload = async function() {
            const sessionID = localStorage.getItem('kt_session_id') || "KT-2026-" + Math.floor(1000 + Math.random() * 9000);
            const soldeCache = localStorage.getItem('kt_solde_global') || "0";
            
            document.getElementById('session-id').innerText = sessionID;
            document.getElementById('user-name').innerText = userTel === "0861769481" ? "Administrateur" : "Utilisateur KT";
            
            const mode = parseInt(soldeCache) >= 5500 ? "GOLD" : "DEMO";
            document.getElementById('account-status').innerText = mode;

            if (supabase) {
                await chargerCiblesSupabase(mode, soldeCache);
            }
        };

        // CHARGEMENT INDIVIDUALISÉ DES CIBLES
        async function chargerCiblesSupabase(mode, soldeCache) {
            const container = document.getElementById('target-container');
            
            try {
                // PROTECTION : On filtre par "user_id_proprietaire" pour que l'utilisateur connecté ne voie que ses cibles
                const { data: ciblesList, error } = await supabase
                    .from('cibles')
                    .select('*')
                    .eq('user_id_proprietaire', userTel)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!ciblesList || ciblesList.length === 0) {
                    container.innerHTML = `<div style="text-align:center; padding:40px; color:#64748b;">Aucun terminal cible détecté dans votre espace.</div>`;
                    return;
                }

                container.innerHTML = ""; 

                ciblesList.forEach(cible => {
                    const numero = cible.numero_cible || cible.telephone_cible; 
                    const nomAppareil = cible.nom_cible || "Appareil Sync";

                    container.innerHTML += `
                        <div class="target-card">
                            <div class="target-header">
                                <span style="font-weight:bold; font-size:13px;">🎯 ${nomAppareil.toUpperCase()} : ${numero}</span>
                                <span class="status-badge" style="background: ${cible.statut_captage === 'CAPTE' ? 'var(--success)' : 'var(--accent)'};">
                                    ${cible.statut_captage || 'DISPONIBLE'}
                                </span>
                            </div>
                            <div class="target-body">
                                <div class="balance-box">
                                    <div>
                                        <span class="balance-label">SOLDE PORTEFEUILLE</span>
                                        <div class="balance-value">${parseInt(soldeCache).toLocaleString('fr-FR')} FC</div>
                                    </div>
                                    <span style="color:#64748b; font-size:10px;">FORFAIT : ${mode}</span>
                                </div>

                                <div class="action-grid">
                                    <button class="btn-tactic" onclick="triggerCaptation('${numero}')">
                                        <span>🎤</span>Captation Silencieuse
                                    </button>
                                    <button class="btn-tactic" onclick="redirigerVers('traceditineraire.html', '${numero}')">
                                        <span>🗺️</span>Tracer Itinéraire
                                    </button>
                                    <button class="btn-tactic" onclick="redirigerVers('smstracing.html', '${numero}')">
                                        <span>📩</span>SMS Tracing (Data/SMS)
                                    </button>
                                    <button class="btn-tactic" onclick="redirigerVers('captation_rapport.html', '${numero}')">
                                        <span>📸</span>Captation Image & Rapport
                                    </button>
                                    <button class="btn-tactic btn-refill" onclick="provisionner()">
                                        <span>⚡</span>APPROVISIONNER MON COMPTE
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });

            } catch (err) {
                console.error("Erreur de synchronisation :", err.message);
                container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--danger);">Échec de liaison avec le serveur satellite.</div>`;
            }
        }

        // ACTION : AJOUTER UNE CIBLE DANS SUPABASE
        async function ajouterCible() {
            const nom = document.getElementById('nom_cible').value.trim();
            const tel = document.getElementById('telephone_cible').value.trim();
            const soldeCache = localStorage.getItem('kt_solde_global') || "0";
            const mode = parseInt(soldeCache) >= 5500 ? "GOLD" : "DEMO";

            if (!nom || !tel) {
                alert("Veuillez renseigner un nom et un numéro pour l'appareil cible.");
                return;
            }

            if (!supabase) {
                alert("Le serveur n'est pas prêt. Veuillez rafraîchir.");
                return;
            }

            try {
                const { error } = await supabase
                    .from('cibles')
                    .insert([
                        {
                            numero_cible: tel,
                            telephone_cible: tel,
                            nom_cible: nom,
                            user_id_proprietaire: userTel,
                            statut_captage: "DISPONIBLE"
                        }
                    ]);

                if (error) throw error;

                alert("📡 Terminal cible ajouté et synchronisé au réseau !");
                document.getElementById('nom_cible').value = "";
                document.getElementById('telephone_cible').value = "";
                
                // Rechargement immédiat de la liste
                await chargerCiblesSupabase(mode, soldeCache);

            } catch (err) {
                alert("Erreur d'enregistrement de la cible : " + err.message);
            }
        }

        window.triggerCaptation = function(num) {
            alert("📡 [Kimia Relay Request]\nLancement de l'écoute environnementale cryptée sur " + num + ".\nFaisceau ascendant synchronisé.");
        }

        window.redirigerVers = function(page, num) {
            window.location.href = `${page}?tel=${encodeURIComponent(num)}`;
        }

        window.provisionner = function() {
            window.location.href = 'approvisionnement.html';
        }

        window.deconnexion = function() {
            localStorage.removeItem('kt_auth_status'); // Propreté de la déconnexion
            window.location.href = 'identification.html';
        }
    </script>
</body>
</html>
