<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Kimia Track</title>
    <style>
        :root { 
            --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; 
            --accent: #eab308; --success: #22c55e; --danger: #ef4444; --shadow: rgba(0,0,0,0.3);
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; padding-bottom: 90px; }
        
        /* Header & Session */
        .header-app { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: var(--card); padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px var(--shadow); }
        .session-info { font-size: 11px; color: var(--primary); letter-spacing: 1px; }
        .user-name { font-weight: bold; font-size: 18px; color: white; }

        /* Formulaire d'ajout rapide (Uniquement visible en GOLD) */
        .add-target-box { background: var(--card); border: 1px dashed #475569; border-radius: 12px; padding: 15px; margin-bottom: 25px; display: none; }
        .add-target-box h3 { margin: 0 0 10px 0; font-size: 14px; color: var(--primary); }
        .add-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .add-inputs input { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px; color: white; font-size: 13px; width: 100%; box-sizing: border-box; }
        .btn-add-submit { background: var(--primary); color: #0f172a; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 13px; }

        /* Structure Accordéon des Cibles */
        .target-grid { display: flex; flex-direction: column; gap: 12px; }
        .target-card { background: var(--card); border-radius: 12px; border: 1px solid #334155; overflow: hidden; }
        
        /* En-tête cliquable de l'accordéon */
        .accordion-trigger { 
            background: rgba(56, 189, 248, 0.05); padding: 14px; display: flex; 
            justify-content: space-between; align-items: center; cursor: pointer; user-select: none;
        }
        .accordion-trigger:active { background: rgba(56, 189, 248, 0.15); }
        .status-badge { font-size: 10px; background: var(--success); color: white; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; font-weight: bold; }
        
        /* Contenu repliable */
        .accordion-content { padding: 15px; border-top: 1px solid #2d3a4f; display: none; }
        .accordion-content.open { display: block; }
        
        .balance-box { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px; border-radius: 10px; margin-bottom: 15px; }
        .balance-label { font-size: 11px; color: #94a3b8; }
        .balance-value { font-size: 16px; font-weight: bold; color: var(--accent); }

        /* Grille d'actions tactiques */
        .action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .btn-tactic { 
            background: #2d3a4f; border: 1px solid #475569; color: white; 
            padding: 12px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; 
            cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; transition: 0.2s;
        }
        .btn-tactic:active { transform: scale(0.95); background: var(--primary); color: #0f172a; }
        .btn-tactic span { font-size: 16px; }
        .btn-refill { grid-column: span 2; background: rgba(34, 197, 94, 0.1); border: 1px dashed var(--success); color: var(--success); }

        /* Barre d'information Forfait Cadeau */
        .demo-banner { background: rgba(234, 179, 8, 0.1); border: 1px solid var(--accent); padding: 10px; border-radius: 8px; font-size: 12px; color: var(--accent); text-align: center; margin-bottom: 15px; }

        /* Navigation Basse */
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid #334155; z-index: 100; }
        .nav-btn { color: #94a3b8; text-decoration: none; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        .nav-btn.active { color: var(--primary); }
        .nav-btn.reclamation { color: var(--accent); }
        .nav-btn.help { color: #38bdf8; } 
    </style>
</head>
<body>

    <div class="header-app">
        <div>
            <span class="session-info" id="session-id">INITIALISATION...</span>
            <div class="user-name" id="user-name">Chargement...</div>
        </div>
        <div>
            <div style="font-size: 10px; color: #94a3b8; text-align: right;">FORFAIT Actif</div>
            <div style="font-size: 14px; font-weight: bold; color: var(--accent); text-align: right;" id="account-status">RECHERCHE...</div>
        </div>
    </div>

    <div class="add-target-box" id="gold-add-box">
        <h3>📡 Enregistrer un terminal satellite (Abonnement GOLD)</h3>
        <div class="add-inputs">
            <input type="text" id="nom_cible" placeholder="Nom (Ex: Mon Appareil)">
            <input type="tel" id="telephone_cible" placeholder="N° de Téléphone">
        </div>
        <button class="btn-add-submit" onclick="ajouterCible()">SYNCHRONISER AU RÉSEAU</button>
    </div>

    <div class="target-grid" id="target-container">
        <div style="text-align:center; padding:40px; color:#64748b; font-style:italic;">Recherche et synchronisation des relais satellites...</div>
    </div>

    <nav class="nav-bar">
        <a href="aide.html" class="nav-btn help"><span>❓</span>Aide</a>
        <a href="#" class="nav-btn active"><span>📡</span>Radar</a>
        <a href="approvisionnement.html" class="nav-btn"><span>💰</span>Wallet</a>
        <a href="https://wa.me/243861769481" class="nav-btn reclamation" target="_blank"><span>⚠️</span>Réclamation</a>
        <a href="#" class="nav-btn" onclick="deconnexion()"><span>🔒</span>Quitter</a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://ufwirghypzowlmeqqgco.supabase.co";
        const SUPABASE_KEY = "sb_publishable_ZMjol0IAFBrmaZULUzR7IA_Gk31Msqq";
        
        let clientSupabase;
        const userTel = localStorage.getItem('kt_user_tel');
        
        if (typeof supabase !== 'undefined') {
            clientSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } else if (typeof Supabase !== 'undefined') {
            clientSupabase = Supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        if (!userTel) { window.location.href = 'identification.html'; }

        window.onload = async function() {
            const sessionID = localStorage.getItem('kt_session_id') || "KT-2026-" + Math.floor(1000 + Math.random() * 9000);
            document.getElementById('session-id').innerText = sessionID;
            document.getElementById('user-name').innerText = userTel === "0861769481" ? "Administrateur" : "Utilisateur KT";
            
            if (clientSupabase) {
                await determinerForfaitEtCharger();
            }
        };

        async function determinerForfaitEtCharger() {
            try {
                // Lecture directe du profil sur Supabase pour savoir s'il est DEMO ou GOLD
                const { data: profil, error } = await clientSupabase
                    .from('profils')
                    .select('statut_compte, solde_fc')
                    .eq('whatsapp_num', userTel)
                    .single();

                if (error) throw error;

                // Si le statut est ACTIF ou payé -> GOLD, sinon -> DEMO
                const isGold = (profil.statut_compte === "ACTIF" || parseInt(profil.solde_fc) >= 5500);
                const mode = isGold ? "GOLD" : "DEMO";
                const solde = profil.solde_fc || 0;

                document.getElementById('account-status').innerText = mode;
                if(mode === "GOLD") {
                    document.getElementById('account-status').style.color = "var(--success)";
                    document.getElementById('gold-add-box').style.display = "block"; // Permet l'ajout de cibles infinies
                }

                await configurerEspaceCibles(mode, solde);

            } catch (err) {
                console.error(err);
                // Repli sur le cache local en cas de problème réseau temporaire
                configurerEspaceCibles("DEMO", 0);
            }
        }

        async function configurerEspaceCibles(mode, soldeCache) {
            const container = document.getElementById('target-container');
            
            if (mode === "DEMO") {
                // Logique DEMO : 1 unique cible imposée (Forfait Cadeau)
                container.innerHTML = `
                    <div class="demo-banner">🎁 Mode DÉMO : Vous bénéficiez d'un terminal de suivi cadeau pendant 30 min.</div>
                    <div class="target-card">
                        <div class="accordion-trigger" style="cursor: default;">
                            <span style="font-weight:bold; font-size:13px;">📲 TERMINAL CADEAU : PROVISOIRE</span>
                            <span class="status-badge" style="background: var(--accent);">ACTIF</span>
                        </div>
                        <div class="accordion-content open">
                            <div class="balance-box">
                                <div><span class="balance-label">SMS TRACING DISPONIBLE</span><div class="balance-value" style="color:var(--success)">3 SMS GRATUITS</div></div>
                            </div>
                            <div class="action-grid">
                                <button class="btn-tactic" onclick="redirigerVers('smstracing.html', 'CADEAU')"><span>📩</span>SMS Tracing (Données)</button>
                                <button class="btn-tactic btn-refill" onclick="provisionner()"><span>⚡</span>PASSER EN MODE GOLD (SUIVI ILLIMITÉ)</button>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                // Logique GOLD : Gestion par Accordéon de tous les numéros ayant obtenu leur pack data/sms
                try {
                    const { data: ciblesList, error } = await clientSupabase
                        .from('cibles')
                        .select('*')
                        .eq('user_id_proprietaire', userTel)
                        .order('created_at', { ascending: false });

                    if (error) throw error;

                    if (!ciblesList || ciblesList.length === 0) {
                        container.innerHTML = `<div style="text-align:center; padding:40px; color:#64748b;">Aucun terminal lié à votre clé Data/SMS. Utilisez le formulaire ci-dessus pour lier un numéro.</div>`;
                        return;
                    }

                    container.innerHTML = "";

                    ciblesList.forEach((cible, index) => {
                        const numero = cible.numero_cible || cible.telephone_cible;
                        const nom = cible.nom_cible || "Terminal Relié";
                        
                        container.innerHTML += `
                            <div class="target-card">
                                <div class="accordion-trigger" onclick="toggleAccordion('content-${index}')">
                                    <span style="font-weight:bold; font-size:13px;">🎯 ${nom.toUpperCase()} (${numero})</span>
                                    <span class="status-badge" style="background:var(--success)">GOLD SYNC</span>
                                </div>
                                <div class="accordion-content" id="content-${index}">
                                    <div class="balance-box">
                                        <div><span class="balance-label">CANAL LIAISON</span><div class="balance-value" style="font-size:13px; color:var(--primary)">DATA & SMS ILLIMITÉS</div></div>
                                        <span style="color:#64748b; font-size:10px;">STATUT : COMPLET</span>
                                    </div>
                                    <div class="action-grid">
                                        <button class="btn-tactic" onclick="triggerCaptation('${numero}')"><span>🎤</span>Captation Environnement</button>
                                        <button class="btn-tactic" onclick="redirigerVers('traceditineraire.html', '${numero}')"><span>🗺️</span>Tracer Itinéraire</button>
                                        <button class="btn-tactic" onclick="redirigerVers('smstracing.html', '${numero}')"><span>📩</span>SMS Tracing Crypté</button>
                                        <button class="btn-tactic" onclick="redirigerVers('captation_rapport.html', '${numero}')"><span>📸</span>Rapport visuel</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } catch (err) {
                    container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--danger);">Erreur lors de la synchronisation satellite.</div>`;
                }
            }
        }

        // Commutateur d'affichage de l'accordéon pour le mode GOLD
        window.toggleAccordion = function(id) {
            const content = document.getElementById(id);
            const isOpen = content.style.display === "block";
            
            // Ferme tous les autres accordéons ouverts pour rester propre sur l'écran du téléphone
            document.querySelectorAll('.accordion-content').forEach(el => el.style.display = "none");
            
            // Bascule l'élément cliqué
            content.style.display = isOpen ? "none" : "block";
        }

        async function ajouterCible() {
            const nom = document.getElementById('nom_cible').value.trim();
            const tel = document.getElementById('telephone_cible').value.trim();

            if (!nom || !tel) { alert("Veuillez remplir le nom et le numéro."); return; }

            try {
                const { error } = await clientSupabase
                    .from('cibles')
                    .insert([{ numero_cible: tel, telephone_cible: tel, nom_cible: nom, user_id_proprietaire: userTel }]);

                if (error) throw error;

                alert("📡 Terminal lié avec succès au forfait GOLD !");
                document.getElementById('nom_cible').value = "";
                document.getElementById('telephone_cible').value = "";
                await determinerForfaitEtCharger();
            } catch (err) {
                alert("Erreur d'ajout : " + err.message);
            }
        }

        window.triggerCaptation = function(num) { alert("📡 Écoute environnementale initialisée sur " + num); }
        window.redirigerVers = function(page, num) { window.location.href = `${page}?tel=${encodeURIComponent(num)}`; }
        window.provisionner = function() { window.location.href = 'approvisionnement.html'; }
        window.deconnexion = function() { sessionStorage.clear(); window.location.href = 'identification.html'; }
    </script>
</body>
</html>
