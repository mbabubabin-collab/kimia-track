<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Kimia Track</title>
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --accent: #eab308; --success: #22c55e; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; min-height: 100vh; justify-content: center; box-sizing: border-box; }
        
        .header { text-align: center; margin-bottom: 20px; }
        .card { background: var(--card); padding: 25px; border-radius: 15px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        
        input { 
            width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; 
            border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box; font-size: 15px;
        }
        input:focus { border-color: var(--primary); outline: none; }

        .btn-register { 
            background: var(--primary); color: #0f172a; border: none; padding: 16px; 
            width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;
            margin-top: 15px; transition: all 0.2s;
        }
        .btn-register:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
        
        .footer-link { display: block; text-align: center; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="color: var(--primary); margin: 0;">Créer un compte</h2>
        <p style="font-size: 13px; opacity: 0.7; margin-top: 5px;">Rejoignez Kimia Track et sécurisez vos appareils</p>
    </div>

    <div class="card">
        <input type="text" id="nom_user" placeholder="Votre nom complet" required>
        <input type="tel" id="tel_user" placeholder="N° WhatsApp (ex: 089...)" required>
        <input type="password" id="password_user" placeholder="Créez un mot de passe" required>
        
        <button class="btn-register" id="btn-submit-reg" disabled onclick="enregistrerInscription()">CONNEXION SERVEUR...</button>
    </div>

    <a href="identification.html" class="footer-link">Déjà inscrit ? Connectez-vous</a>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        let clientSupabase;

        function initialiserSupabase() {
            const SUPABASE_URL = "https://ufwirghypzowlmeqqgco.supabase.co";
            const SUPABASE_KEY = "sb_publishable_ZMjol0IAFBrmaZULUzR7IA_Gk31Msqq";
            const btn = document.getElementById('btn-submit-reg');

            try {
                if (typeof supabase !== 'undefined') {
                    clientSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                } else if (typeof Supabase !== 'undefined') {
                    clientSupabase = Supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                }

                if (clientSupabase) {
                    btn.disabled = false;
                    btn.innerText = "CONTINUER VERS L'ACTIVATION";
                } else {
                    setTimeout(initialiserSupabase, 300);
                }
            } catch (e) {
                setTimeout(initialiserSupabase, 300);
            }
        }

        window.addEventListener('DOMContentLoaded', initialiserSupabase);

        async function enregistrerInscription() {
            const btn = document.getElementById('btn-submit-reg');
            const nom = document.getElementById('nom_user').value.trim();
            const tel = document.getElementById('tel_user').value.trim();
            const password = document.getElementById('password_user').value.trim();

            if (!nom || !tel || !password) {
                alert("Veuillez remplir tous les champs obligatoires.");
                return;
            }

            if (!clientSupabase) {
                alert("Le serveur n'est pas encore prêt, veuillez patienter une seconde...");
                return;
            }

            btn.disabled = true;
            btn.innerText = "⌛ ENREGISTREMENT SUR LE SERVEUR...";

            try {
                // Sauvegarde locale de secours
                localStorage.setItem('kt_user_nom', nom);
                localStorage.setItem('kt_user_tel', tel);

                // Écriture forcée avec UPSERT pour éviter les blocages de clés uniques
                const { error } = await clientSupabase
                    .from('profils')
                    .upsert([
                        { 
                            whatsapp_num: tel, 
                            nom: nom, 
                            mot_de_passe: password,
                            code_transaction_activation: "EN-ATTENTE",
                            statut_compte: "ATTENTE",
                            solde_fc: 0,
                            sms_tracking_restants: 0
                        }
                    ], { onConflict: 'whatsapp_num' });

                if (error) throw error;

                alert("✅ Inscription réussie ! Passons à la configuration de votre portefeuille.");
                
                // Redirection fluide après l'alert
                setTimeout(() => {
                    window.location.href = "approvisionnement.html";
                }, 100);

            } catch (err) {
                console.error(err);
                alert("Erreur lors de la création du compte : " + err.message);
                btn.disabled = false;
                btn.innerText = "CONTINUER VERS L'ACTIVATION";
            }
        }
    </script>
</body>
</html>
